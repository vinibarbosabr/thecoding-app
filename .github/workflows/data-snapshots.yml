name: data snapshots

on:
  schedule:
    - cron: "41 1,7,13,19 * * *" # 4x/24h at :41; the epoch is ~7.5h, so every epoch still contains at least one run (ADR-05)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: snapshot onto the rolling data branch
        run: |
          set -euo pipefail
          git config user.name "thecoding data bot"
          git config user.email "actions@users.noreply.github.com"
          if git fetch origin data/snapshots; then
            git checkout data/snapshots
            git merge origin/main --no-edit
          else
            git checkout -b data/snapshots
          fi
          node scripts/data-snapshot.mjs
          git add public/data/epochs.json
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "data: epoch snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data/snapshots

      - name: publish the rolling snapshot pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head data/snapshots --state open --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head data/snapshots \
              --title "data: epoch snapshots" \
              --body "rolling epoch snapshots for the #/data view (ADR-04 §4, ADR-05). created and auto-merged by the workflow; each run publishes the freshest epochs to main."
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --merge data/snapshots
